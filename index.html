<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jan Kreme&#328;</title>
  <style>
    body {
      font-family: sans-serif;
      background:
        radial-gradient(circle at 15% 20%, #12324a 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, #2a153d 0%, transparent 42%),
        #0b1118;
      background-size: 140% 140%, 160% 160%, 100% 100%;
      background-position: 0% 0%, 100% 100%, 0% 0%;
      color: #ffffff;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      position: relative;
      overflow: hidden;
      animation: gradient-drift 22s ease-in-out infinite alternate;
    }

    @keyframes gradient-drift {
      0% {
        background-position: 0% 0%, 100% 100%, 0% 0%;
      }
      50% {
        background-position: 30% 25%, 75% 70%, 0% 0%;
      }
      100% {
        background-position: 55% 35%, 50% 40%, 0% 0%;
      }
    }

    .layout-container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      padding: 1.5rem;
      box-sizing: border-box;
    }

    #particle-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    #codeword-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      font-family: "Consolas", "Courier New", monospace;
    }

    .codeword {
      position: absolute;
      color: rgba(178, 247, 255, 0.38);
      white-space: nowrap;
      user-select: none;
      will-change: transform, opacity;
      text-shadow: 0 0 14px rgba(90, 210, 245, 0.36);
    }

    .card {
      box-sizing: border-box;
      background: linear-gradient(
        135deg,
        rgba(21, 38, 33, 0.42) 0%,
        rgba(12, 24, 22, 0.28) 100%
      );
      padding: 2rem;
      border-radius: 16px;
      border: 1px solid rgba(147, 255, 213, 0.2);
      box-shadow:
        0 14px 40px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(203, 255, 236, 0.22);
      backdrop-filter: blur(10px) saturate(130%);
      -webkit-backdrop-filter: blur(10px) saturate(130%);
      display: flex;
      align-items: center;
      gap: 2rem;
      max-width: 500px;
      width: min(500px, calc(100vw - 3rem));
      flex-direction: row;
      position: relative;
      grid-column: 1;
      grid-row: 1;
      align-self: start;
      justify-self: start;
    }

    img.profile {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      margin-right: 0.5rem;
    }

    .info {
      text-align: left;
      flex: 1;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    .subtitle {
      color: #c2cedd;
      margin-bottom: 1rem;
    }

    .links a {
      color: #61dafb;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0.5rem 0;
    }

    .links a:hover {
      text-decoration: underline;
    }

    svg {
      width: 20px;
      height: 20px;
      fill: #61dafb;
    }

    @media (max-width: 600px) {
      .card {
        flex-direction: column;
        text-align: center;
      }

      .info {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <canvas id="particle-bg" aria-hidden="true"></canvas>
  <div id="codeword-layer" aria-hidden="true"></div>
  <div class="layout-container">
    <div class="card">
      <img src="profile.jpg" alt="Profile Picture of Jan Kreme&#328;" class="profile" />
      <div class="info">
        <h1>Jan Kreme&#328;</h1>
        <div class="subtitle">Software Engineer</div>
        <div class="links">
          <div>
            <a href="https://github.com/captain-refactor" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 .5C5.4.5 0 5.9 0 12.5c0 5.3 3.4 9.8 8.1 11.4.6.1.8-.3.8-.6v-2.3c-3.3.7-4-1.6-4-1.6-.5-1.3-1.2-1.6-1.2-1.6-1-.7.1-.7.1-.7 1.1.1 1.6 1.2 1.6 1.2 1 .1.9 1.6.9 1.6.9 1.5 2.4 1.1 3 .8.1-.7.4-1.1.7-1.3-2.7-.3-5.6-1.3-5.6-5.9 0-1.3.5-2.3 1.2-3.2-.1-.3-.5-1.4.1-3 0 0 1-.3 3.3 1.2a11.3 11.3 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.7.1 3 .8.9 1.2 2 1.2 3.2 0 4.6-2.9 5.6-5.7 5.9.4.3.8 1 .8 2.1v3.1c0 .3.2.7.8.6A12 12 0 0 0 24 12.5C24 5.9 18.6.5 12 .5Z"/>
              </svg>
              GitHub
            </a>
          </div>
          <div>
            <a href="https://www.linkedin.com/in/jan-kreme%C5%88-496087a4/" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 0h-14c-2.8 0-5 2.2-5 5v14c0 2.7 2.2 5 5 5h14c2.8 0 5-2.3 5-5v-14c0-2.8-2.2-5-5-5zM7.1 20h-3v-11h3v11zm-1.5-12.3c-1 0-1.7-.8-1.7-1.7s.8-1.7 1.7-1.7 1.7.8 1.7 1.7-.8 1.7-1.7 1.7zm15.4 12.3h-3v-5.6c0-1.3 0-3-1.8-3s-2 1.4-2 2.9v5.7h-3v-11h2.9v1.5h.1c.4-.7 1.4-1.4 2.9-1.4 3.1 0 3.7 2.1 3.7 4.7v6.2z"/>
              </svg>
              LinkedIn
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const canvas = document.getElementById("particle-bg");
      const codewordLayer = document.getElementById("codeword-layer");
      const ctx = canvas.getContext("2d");
      if (!ctx || !codewordLayer) return;

      const DPR = Math.min(window.devicePixelRatio || 1, 2);
      const isMobile = window.innerWidth < 768;
      const particleCount = isMobile ? 90 : 150;
      const particles = [];
      const wordCount = isMobile ? 16 : 28;
      const codewords = [];
      let width = 0;
      let height = 0;
      const words = [
        "git commit -m", "npm run build", "pnpm dev", "docker compose up",
        "kubectl get pods", "terraform apply", "gh pr create", "curl -X POST",
        "SELECT id, name", "EXPLAIN ANALYZE", "redis-cli", "localhost:3000",
        "HTTP 200", "HTTP 500", "try/catch", "Promise.all()", "async/await",
        "useEffect()", "useMemo()", "refactor(core)", "feature/landing",
        "hotfix/auth", "main", "origin", "CI passed", "deploy:prod",
        "rollback", "rate_limit", "webhook", "event_bus", "queue_worker",
        "cache_hit", "edge_runtime", "observability", "tracing"
      ];

      const rand = (min, max) => Math.random() * (max - min) + min;
      const onResize = () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * DPR);
        canvas.height = Math.floor(height * DPR);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      };

      for (let i = 0; i < particleCount; i += 1) {
        particles.push({
          x: rand(0, window.innerWidth),
          y: rand(0, window.innerHeight),
          r: rand(0.7, 2.2),
          vx: rand(-0.2, 0.2),
          vy: rand(-0.15, 0.15),
          a: rand(0.25, 0.7)
        });
      }

      const spawnCodeword = (word) => {
        const el = document.createElement("span");
        el.className = "codeword";
        el.textContent = word;
        const size = rand(12, 20);
        const speed = rand(0.15, 0.55);
        const drift = rand(-0.12, 0.12);
        const alpha = rand(0.14, 0.3);
        el.style.fontSize = size + "px";
        el.style.opacity = String(alpha);
        codewordLayer.appendChild(el);
        return {
          el,
          x: rand(0, width),
          y: rand(0, height),
          vx: speed,
          vy: drift
        };
      };

      onResize();
      for (let i = 0; i < wordCount; i += 1) {
        codewords.push(spawnCodeword(words[i % words.length]));
      }
      window.addEventListener("resize", onResize);

      const draw = () => {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < particles.length; i += 1) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < -20) p.x = width + 20;
          if (p.x > width + 20) p.x = -20;
          if (p.y < -20) p.y = height + 20;
          if (p.y > height + 20) p.y = -20;

          ctx.beginPath();
          ctx.fillStyle = "rgba(97, 218, 251, " + p.a + ")";
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }

        for (let i = 0; i < particles.length; i += 1) {
          for (let j = i + 1; j < particles.length; j += 1) {
            const a = particles[i];
            const b = particles[j];
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const dist = Math.hypot(dx, dy);
            if (dist > 120) continue;
            const alpha = (1 - dist / 120) * 0.2;
            ctx.strokeStyle = "rgba(97, 218, 251, " + alpha + ")";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }

        for (let i = 0; i < codewords.length; i += 1) {
          const w = codewords[i];
          w.x += w.vx;
          w.y += w.vy;
          if (w.x > width + 260) {
            w.x = -220;
            w.y = rand(0, height);
          }
          if (w.y < -30) w.y = height + 30;
          if (w.y > height + 30) w.y = -30;
          w.el.style.transform = "translate(" + w.x.toFixed(1) + "px, " + w.y.toFixed(1) + "px)";
        }
      };

      if (reduceMotion) {
        draw();
        return;
      }

      const tick = () => {
        draw();
        requestAnimationFrame(tick);
      };
      tick();
    })();
  </script>
</body>
</html>
